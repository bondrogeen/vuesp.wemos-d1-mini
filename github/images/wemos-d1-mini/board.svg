<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05081f"/>
      <stop offset="1" stop-color="#07112c"/>
    </linearGradient>
    <linearGradient id="board" x1="200" y1="90" x2="1000" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1b42"/>
      <stop offset="1" stop-color="#08122e"/>
    </linearGradient>
    <linearGradient id="screen" x1="620" y1="150" x2="940" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#031a1a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 1l10 5-10 5" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#94a3b8" stroke-width="1">
    <path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200M0 640h1200M0 720h1200"/>
    <path d="M80 0v760M160 0v760M240 0v760M320 0v760M400 0v760M480 0v760M560 0v760M640 0v760M720 0v760M800 0v760M880 0v760M960 0v760M1040 0v760M1120 0v760"/>
  </g>

  <text x="80" y="72" fill="#6ee7b7" font-size="15" font-weight="700" letter-spacing="3">VUESP · WEMOS D1 MINI</text>
  <text x="80" y="122" fill="#ffffff" font-size="40" font-weight="800">Wemos D1 mini</text>
  <text x="80" y="158" fill="#94a3b8" font-size="18">Компактный узел на ESP8266</text>

  <g>
    <rect x="200" y="200" width="800" height="430" rx="34" fill="url(#board)" stroke="#1e3a6e" stroke-width="3"/>
    <rect x="222" y="222" width="756" height="386" rx="24" fill="none" stroke="#1e3a6e" stroke-width="1" stroke-dasharray="8 8" opacity="0.7"/>

    <rect x="248" y="256" width="344" height="240" rx="18" fill="#111827" stroke="#374151" stroke-width="2"/>
    <text x="268" y="300" fill="#ffffff" font-size="24" font-weight="800">ESP8266</text>
    <text x="268" y="334" fill="#cbd5e1" font-size="13">ESP-12E · 80 МГц</text><text x="268" y="358" fill="#cbd5e1" font-size="13">Wi-Fi 2.4 ГГц</text><text x="268" y="382" fill="#cbd5e1" font-size="13">LittleFS</text><text x="268" y="406" fill="#cbd5e1" font-size="13">4 МБ flash</text>
    <text x="268" y="472" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="2">МИКРОКОНТРОЛЛЕР</text>

    <rect x="620" y="256" width="330" height="240" rx="18" fill="#031a1a" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <rect x="642" y="276" width="286" height="170" rx="8" fill="url(#screen)" stroke="#134e4a" stroke-width="2"/>
    <text x="662" y="314" fill="#6ee7b7" font-size="20" font-weight="800">Порты</text>
    <text x="662" y="346" fill="#cbd5e1" font-size="14">2 входа</text><text x="662" y="372" fill="#cbd5e1" font-size="14">1 выход</text><text x="662" y="398" fill="#cbd5e1" font-size="14">2 PWM</text><text x="662" y="424" fill="#cbd5e1" font-size="14">1 ADC (A0)</text>
    <text x="785" y="472" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="2">ОСНОВНОЙ МОДУЛЬ</text>

    <text x="600" y="540" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">Wemos D1 mini: реле, диммер, кнопки и аналоговый датчик</text>
    <text x="600" y="566" text-anchor="middle" fill="#94a3b8" font-size="13">Пины задаются в src/gpio/gpio.cpp и доступны в dashboard</text>
  </g>

  <g font-size="13" fill="#cbd5e1">
    <circle cx="80" cy="680" r="5" fill="#10b981"/><text x="96" y="685">ESP8266</text><circle cx="190.4" cy="680" r="5" fill="#28b7f0"/><text x="206.4" y="685">D1 mini</text><circle cx="300.8" cy="680" r="5" fill="#f59e0b"/><text x="316.8" y="685">PWM</text><circle cx="382.4" cy="680" r="5" fill="#a78bfa"/><text x="398.4" y="685">ADC</text>
  </g>
</svg>
