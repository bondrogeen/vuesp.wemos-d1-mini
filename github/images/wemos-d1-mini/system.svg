<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" fill="none" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05081f"/>
      <stop offset="1" stop-color="#07112c"/>
    </linearGradient>
    <linearGradient id="board" x1="200" y1="90" x2="1000" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1b42"/>
      <stop offset="1" stop-color="#08122e"/>
    </linearGradient>
    <linearGradient id="screen" x1="620" y1="150" x2="940" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#031a1a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 1l10 5-10 5" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#94a3b8" stroke-width="1">
    <path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200"/>
    <path d="M80 0v620M160 0v620M240 0v620M320 0v620M400 0v620M480 0v620M560 0v620M640 0v620M720 0v620M800 0v620M880 0v620M960 0v620M1040 0v620M1120 0v620"/>
  </g>

  <text x="80" y="72" fill="#6ee7b7" font-size="15" font-weight="700" letter-spacing="3">VUESP · WEMOS D1 MINI</text>
  <text x="80" y="122" fill="#ffffff" font-size="38" font-weight="800">Как устроен проект</text>
  <text x="80" y="158" fill="#94a3b8" font-size="17">Браузер → Wi-Fi → ESP8266 → GPIO и датчики</text>

  <path d="M378 342h74" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="415" y="376" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700">Wi-Fi</text><path d="M748 342h74" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="785" y="376" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700">GPIO</text>
  <rect x="90" y="230" width="280" height="230" rx="18" fill="#0d1b42" stroke="#6ee7b7" stroke-width="2"/><text x="230" y="286" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">Браузер</text><text x="230" y="322" text-anchor="middle" fill="#94a3b8" font-size="13">Vue UI</text><text x="230" y="347" text-anchor="middle" fill="#94a3b8" font-size="13">dashboard</text><text x="230" y="372" text-anchor="middle" fill="#94a3b8" font-size="13">GPIO</text><text x="230" y="397" text-anchor="middle" fill="#94a3b8" font-size="13">ScriptRunner</text><text x="230" y="434" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="1">ВЕБ-ИНТЕРФЕЙС</text><rect x="460" y="230" width="280" height="230" rx="18" fill="#0d1b42" stroke="#10b981" stroke-width="2"/><text x="600" y="286" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">ESP8266</text><text x="600" y="322" text-anchor="middle" fill="#94a3b8" font-size="13">Wi-Fi</text><text x="600" y="347" text-anchor="middle" fill="#94a3b8" font-size="13">WebSocket</text><text x="600" y="372" text-anchor="middle" fill="#94a3b8" font-size="13">LittleFS</text><text x="600" y="397" text-anchor="middle" fill="#94a3b8" font-size="13">OTA</text><text x="600" y="434" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700" letter-spacing="1">ПРОШИВКА</text><rect x="830" y="230" width="280" height="230" rx="18" fill="#0d1b42" stroke="#28b7f0" stroke-width="2"/><text x="970" y="286" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">Порты и датчики</text><text x="970" y="322" text-anchor="middle" fill="#94a3b8" font-size="13">2 входа · 1 выход</text><text x="970" y="347" text-anchor="middle" fill="#94a3b8" font-size="13">2 PWM · ADC A0</text><text x="970" y="372" text-anchor="middle" fill="#94a3b8" font-size="13">OneWire</text><text x="970" y="434" text-anchor="middle" fill="#28b7f0" font-size="11" font-weight="700" letter-spacing="1">ПЕРИФЕРИЯ</text>

  <text x="600" y="530" text-anchor="middle" fill="#94a3b8" font-size="13">Локальная прошивка Vuesp · без обязательного облака</text>
</svg>
